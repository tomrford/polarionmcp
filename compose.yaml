services:
  polarionmcp:
    build: .
    image: polarionmcp:latest
    container_name: polarionmcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POLARION_BASE_URL: ${POLARION_BASE_URL:?POLARION_BASE_URL is required}
      POLARION_GUIDELINES: ${POLARION_GUIDELINES:-}
      REST_PAGE_SIZE: ${REST_PAGE_SIZE:-}
      FETCH_CONCURRENCY_COUNT: ${FETCH_CONCURRENCY_COUNT:-}
      READ_ATTACHMENT_INLINE_RESULT_MAX_BYTES: ${READ_ATTACHMENT_INLINE_RESULT_MAX_BYTES:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
